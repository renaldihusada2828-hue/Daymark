name: Build Daymark APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate project
        shell: bash
        run: |
          if [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="."
          else
            ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -1 || true)
            if [ -z "$ZIP_FILE" ]; then
              echo "::error::Project/ZIP Daymark tidak ditemukan."
              exit 1
            fi
            rm -rf extracted
            mkdir extracted
            unzip -q "$ZIP_FILE" -d extracted
            PROJECT_DIR=$(find extracted -type f -name settings.gradle.kts -printf '%h\n' | head -1)
          fi
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Check Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -n "$SDK"
          test -f "$SDK/platforms/android-35/android.jar" || { echo "::error::Android API 35 belum tersedia di runner."; exit 1; }
          echo "Android SDK OK: $SDK"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daymark-v2-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: daymark-v2.2-source
          path: ${{ env.PROJECT_DIR }}
          if-no-files-found: error
