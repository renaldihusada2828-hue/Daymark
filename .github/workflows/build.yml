
  name: Build Daymark APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find ZIP
        shell: bash
        run: |
          echo "Mencari file ZIP..."

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::File ZIP project tidak ditemukan."
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Project
        shell: bash
        run: |
          rm -rf extracted

          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "=== HASIL EXTRACT ==="
          find extracted -maxdepth 5 -type f | sort

      - name: Find Android Project
        shell: bash
        run: |
          PROJECT_DIR=$(find extracted \
            -type f \
            -name "settings.gradle.kts" \
            -printf '%h\n' \
            | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::settings.gradle.kts tidak ditemukan."
            echo "Isi folder extracted:"
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Project ditemukan:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -z "$ANDROID_HOME" ]; then
            echo "::error::ANDROID_HOME tidak ditemukan."
            exit 1
          fi

          echo "=== SDK PLATFORMS ==="
          ls -la "$ANDROID_HOME/platforms" || true

          echo "=== SDK BUILD TOOLS ==="
          ls -la "$ANDROID_HOME/build-tools" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare Project
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== PROJECT DIRECTORY ==="
          pwd

          echo "=== PROJECT FILES ==="
          find . -maxdepth 6 -type f | sort

          echo "=== GRADLE VERSION ==="
          gradle --version

      - name: Build APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "================================"
          echo "BUILD DAYMARK APK"
          echo "================================"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Check APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          echo "Mengecek APK..."

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK tidak ditemukan."
            echo "Isi folder output:"
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo ""
          echo "================================"
          echo "APK BERHASIL"
          echo "================================"

          ls -lh "$APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daymark-APK
          path: extracted/Daymark/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Daymark-Build-Logs
          path: |
            extracted/**/build/outputs/**
            extracted/**/build/reports/**
          if-no-files-found: ignore          echo "ZIP ditemukan: $ZIP_FILE"

            rm -rf extracted
            mkdir extracted

            unzip -q "$ZIP_FILE" -d extracted

            PROJECT_DIR=$(find extracted \
              -type f \
              -name "settings.gradle.kts" \
              -printf '%h\n' | head -1)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::settings.gradle.kts tidak ditemukan."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project:"
          echo "$PROJECT_DIR"

      - name: Check Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          if [ -z "$SDK" ]; then
            echo "::error::Android SDK tidak ditemukan."
            exit 1
          fi

          echo "Android SDK: $SDK"

          if [ ! -f "$SDK/platforms/android-35/android.jar" ]; then
            echo "::error::Android API 35 belum tersedia di runner."
            exit 1
          fi

          echo "Android SDK API 35 OK."

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Check project files
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "=== PROJECT ==="
          pwd

          echo "=== FILES ==="
          find . -maxdepth 6 -type f | sort

          echo "=== GRADLE ==="
          gradle --version

      - name: Build debug APK
        working-directory: ${{
