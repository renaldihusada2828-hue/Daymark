name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::File ZIP project tidak ditemukan."
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Project
        shell: bash
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "=== HASIL EXTRACT ==="
          find extracted -maxdepth 5 -type f | sort

      - name: Find Android Project
        shell: bash
        run: |
          PROJECT_DIR=$(find extracted \
            -type f \
            -name "settings.gradle.kts" \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::settings.gradle.kts tidak ditemukan."
            exit 1
          fi

          echo "Project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Check Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "=== PROJECT DIRECTORY ==="
          pwd

          echo "=== FILES ==="
          find . -maxdepth 5 -type f | sort

          echo "=== GRADLE VERSION ==="
          gradle --version

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Check APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK tidak ditemukan."
            exit 1
          fi

          echo "APK BERHASIL:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daymark-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
